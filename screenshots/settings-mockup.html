<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh settings — General</title>
<style>
  /* Theme tokens approximated from the dsh web light theme, with the same
     fallbacks the plugin itself uses. */
  :root {
    --dsw-alias-label-primary: #1b1c1f;
    --dsw-alias-label-secondary: #6b6f76;
    --dsw-alias-label-tertiary: #8b9098;
    --dsw-alias-border-l1: #e6e8eb;
    --dsw-alias-border-l2: #eceef1;
    --dsw-alias-bg-base: #ffffff;
    --dsw-alias-bg-module-platform: #f2f3f5;
    --dsw-alias-brand-primary: #4d6bfe;
    --dsw-alias-interactive-bg-hover: #f0f1f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 44px;
    background: #ffffff;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--dsw-alias-label-primary);
    width: 760px;
  }
  .panel-title { font-size: 18px; font-weight: 600; line-height: 26px; margin: 0 0 4px; }
  .panel-sub { font-size: 13px; line-height: 20px; color: var(--dsw-alias-label-tertiary); margin: 0 0 24px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--dsw-alias-label-secondary); margin: 0 0 8px; }

  /* shipped row shape: EnterBehaviorRow.module.css */
  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 0; border-bottom: 1px solid var(--dsw-alias-border-l2);
  }
  .rowText { display: flex; flex-direction: column; flex: 1; gap: 4px; min-width: 0; padding-right: 48px; }
  .title { font-size: 14px; font-weight: 400; line-height: 22px; color: var(--dsw-alias-label-primary); }
  .desc { font-size: 12px; font-weight: 400; line-height: 18px; color: var(--dsw-alias-label-tertiary); }
  .selector {
    display: inline-flex; align-items: center; gap: 12px; height: 36px; padding: 0 14px;
    border: none; border-radius: 18px; cursor: pointer;
    background: var(--dsw-alias-bg-module-platform);
    color: var(--dsw-alias-label-primary);
    font-size: 14px; line-height: 22px; font-family: inherit;
  }
  .selector:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .chevron { width: 14px; height: 14px; }
</style>
</head>
<body>
  <h1 class="panel-title">通用</h1>
  <p class="panel-sub">设置 → 通用 · Settings → General</p>

  <div class="section-title">会话与会话行为</div>

  <div class="row">
    <div class="rowText">
      <div class="title">语言</div>
      <div class="desc">界面语言</div>
    </div>
    <button class="selector">简体中文<svg class="chevron" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.2 6.2 8 10l3.8-3.8 1.2 1.2-5 5-5-5z"/></svg></button>
  </div>

  <div class="row">
    <div class="rowText">
      <div class="title">繁忙时 Enter 键行为</div>
      <div class="desc">agent 正在运行时，按 Enter 是排队发送还是插话发送</div>
    </div>
    <button class="selector">排队发送<svg class="chevron" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.2 6.2 8 10l3.8-3.8 1.2 1.2-5 5-5-5z"/></svg></button>
  </div>

  <!-- this plugin's row: inline styles exactly as client.js renders them -->
  <div class="row" style="align-items: flex-start;">
    <div class="rowText">
      <div class="title">回车立即发送队列首条</div>
      <div class="desc">开启后：输入框空白且队列有待发消息时，按 Enter 立刻把队列第一条插话发送到当前回合；Ctrl/Cmd+Enter 的「插话全部」行为不变。</div>
    </div>
    <button
      type="button"
      role="switch"
      aria-checked="true"
      aria-label="回车立即发送队列首条"
      title="已开启"
      style="position:relative;flex:none;width:44px;height:24px;margin-top:4px;padding:0;border:none;border-radius:12px;cursor:pointer;background:var(--dsw-alias-brand-primary, #4d6bfe);transition:background .2s">
      <span style="position:absolute;top:2px;left:22px;width:20px;height:20px;border-radius:50%;background:var(--dsw-alias-bg-base, #fff);transition:left .2s"></span>
    </button>
  </div>
</body>
</html>
